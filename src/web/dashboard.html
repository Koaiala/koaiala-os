<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koaiala OS</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18202a}
header{background:#111827;color:white;padding:24px 6%} main{max-width:1200px;margin:24px auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0001}
.label{font-size:12px;text-transform:uppercase;color:#667085}.value{font-size:26px;font-weight:700;margin-top:8px}
section{margin-top:22px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}button{padding:10px 16px;border:0;border-radius:8px;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word}.ok{font-weight:700}
</style>
</head>
<body>
<header><h1>Koaiala OS</h1><div>Núcleo de inteligência econômica</div></header>
<main>
<section class="grid">
<div class="card"><div class="label">Status</div><div class="value" id="status">...</div></div>
<div class="card"><div class="label">Score macro</div><div class="value" id="score">...</div></div>
<div class="card"><div class="label">Cenário</div><div class="value" id="cenario">...</div></div>
<div class="card"><div class="label">Confiança</div><div class="value" id="confianca">...</div></div>
</div>
<section class="card"><button onclick="carregar()">Atualizar análise</button><div id="tempo"></div></section>
<section class="card"><h2>Indicadores</h2><div id="indicadores">Carregando...</div></section>
<section class="card"><h2>Riscos</h2><pre id="riscos">Carregando...</pre></section>
<section class="card"><h2>Decisão macro</h2><pre id="decisao">Carregando...</pre></section>
<section class="card"><h2>Forecast</h2><pre id="forecast">Carregando...</pre></section>
</main>
<script>
const API='http://127.0.0.1:8000';
async function get(p){const r=await fetch(API+p);return r.json()}
async function carregar(){
 document.getElementById('status').textContent='EXECUTANDO';
 const run=await get('/run');
 if(run.status!=='OK'){document.getElementById('status').textContent='ERRO';return}
 const c=run.cenario;document.getElementById('status').textContent='OK';
 document.getElementById('score').textContent=Number(c.score).toFixed(4);
 document.getElementById('cenario').textContent=c.classificacao;
 document.getElementById('confianca').textContent=c.confianca.nivel;
 document.getElementById('tempo').textContent='Ciclo: '+run.duracao_segundos+'s';
 const inds=await get('/indicators');
 document.getElementById('indicadores').innerHTML=Object.values(inds.indicadores).map(x=>`<div class="row"><span>${x.code}</span><span>${x.frequency||x.frequencia||''}</span></div>`).join('');
 document.getElementById('riscos').textContent=JSON.stringify(run.riscos,null,2);
 document.getElementById('decisao').textContent=JSON.stringify(run.decisao,null,2);
 document.getElementById('forecast').textContent=JSON.stringify(run.previsoes,null,2);
}
carregar();
</script>
</body></html>
